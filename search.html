<script>

(async function(){const S=window.OVE_SITE,el=S.el;const data=await S.loadEvents();
const pages=[["Events","events.html","calendar subscribe ogden valley weber county"],["Restaurants","restaurants.html","eat food dining coffee pizza"],["Valley Businesses","businesses.html","shop store rentals lodging"],["Local Artists","artists.html","art painter photographer music"],["Beauty & Wellness","beauty.html","salon hair massage spa yoga fitness gym nails lash therapy"],["Farm Stands & Local Food","farm.html","farm beef eggs honey bakery market pumpkin ranch"],["Food Trucks","foodtrucks.html","food truck tacos festival"],["Home Services","services.html","handyman repair drywall door cleaning window washing landscaping snow removal plow car detailing plumbing electrical"],["Who's open this week","open-this-week.html","open closed hours off-season shoulder season"],["Valley Help Wanted","jobs.html","jobs hiring work employment seasonal"],["Road & Weather","safety.html","road weather forecast snow rain lightning radar storm fire closure canyon water alert safety meeting council"],["Live view","live.html","webcam camera canyon snowbasin powder mountain nordic"],["Night sky","night-sky.html","stars moon aurora northern lights dark sky"],["Valley photos","valley-photos.html","photos pictures gallery scenery sunrise sunset fall snow pineview"],["Photo contest","photo-contest.html","photo contest monthly"],["Guess the Spot","guess-the-spot.html","guess puzzle photo"],["Then & Now","then-and-now.html","history old photo"],["This weekend","weekend.html","weekend share"],["10 years","ten-years.html","history anniversary"],["Send something in","submit.html","submit event business artist"],["Valley Know-How","know-how.html","class classes learn lesson teach canning bread quilting workshop"],["Sponsor a spot","sponsor.html","sponsor advertise"],["Sponsor spotlight: Yes, I Can Fix That","spotlight-yes-i-can-fix-that.html","handyman repair drywall doors flooring lessons learning center seth"]];
const ev=S.allEvents(data);const P=S.P;
function run(q){const box=document.getElementById("sres");box.replaceChildren();q=q.trim().toLowerCase();if(q.length<2)return;
  const has=o=>JSON.stringify(o).toLowerCase().includes(q);
  const sec=(title,items,make)=>{if(!items.length)return;const s=el("section",{style:"padding:0;margin-bottom:18px"},[el("h2",{style:"font-size:22px;margin-bottom:10px",text:title+" ("+items.length+")"})]);const g=el("div",{class:"grid"});items.slice(0,24).forEach(i=>g.append(make(i)));s.append(g);box.append(s)};
  sec("Events",ev.filter(has),e=>el("article",{class:"card"},[el("h3",{style:"font-size:18px",text:e.t}),el("p",{class:"meta",text:S.dayName(e.s)+(e.allDay?"":" · "+S.timeStr(e.s))+(e.loc?" · "+e.loc:"")}),el("a",{href:"events.html",text:"See on the calendar"})]));
  [["Restaurants","restaurants","restaurants.html"],["Businesses","businesses","businesses.html"],["Beauty & Wellness","beauty","beauty.html"],["Farm Stands & Local Food","farm","farm.html"],["Food Trucks","foodtrucks","foodtrucks.html"],["Home Services","services","services.html"],["Artists","artists","artists.html"]].forEach(([t,k,h])=>sec(t,(P[k]||[]).filter(has),p=>el("article",{class:"card"},[el("h3",{style:"font-size:18px",text:p.name}),el("p",{class:"meta",text:[p.type||p.medium,p.town||p.area].filter(Boolean).join(" · ")}),el("a",{href:h,text:"Open "+t.toLowerCase()})])));
  sec("Pages",pages.filter(p=>(p[0]+" "+p[2]).toLowerCase().includes(q)),p=>el("article",{class:"card"},[el("h3",{style:"font-size:18px"},[el("a",{href:p[1],text:p[0]})])]));
  if(!box.children.length)box.append(el("div",{class:"empty"},[el("p",{text:"Nothing found for “"+q+"”. Try a shorter word."})]))}
const inp=document.getElementById("sq");inp.addEventListener("input",()=>run(inp.value));const q0=new URLSearchParams(location.search).get("q");if(q0){inp.value=q0;run(q0)}inp.focus();
})();
</script>
