name: Update calendars and night sky
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-data.mjs
      - name: Save changes
        run: |
          git config user.name "ogdenvalley-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/sky.json
          if git diff --cached --quiet; then echo "Nothing changed"; else git commit -m "Update events and night sky" && git push; fi
